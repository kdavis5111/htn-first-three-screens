<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeresThe.News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <a class="brand" href="index.html">HeresThe<span class="dot">.</span><em>News</em></a>
  </header>

  <main class="hero">
    <div class="demo" aria-hidden="true">
      <div class="screen mode-headlines" id="demoScreen"></div>
      <div class="caps" id="demoCap"></div>
    </div>

    <h1>Just what happened. <em>Every fact labeled, every source named.</em></h1>

    <div class="actions">
      <a class="btn btn-primary" href="topics.html">Pick my topics</a>
      <a class="btn btn-link" href="style.html">Skip to today's news</a>
    </div>
  </main>
</div>
<script src="story.js"></script>
<script>
const screen = document.getElementById("demoScreen"), cap = document.getElementById("demoCap");
screen.innerHTML = STORY_HTML;
const PHASES = [["headlines","<b>Headlines</b> only"],["compact","<b>Compact</b> · why it matters"],["detailed scroll-1","<b>Detailed</b> · every fact labeled"],["detailed scroll-2","Every source <b>named</b>"]];
let i = 0;
function show(){ const [m,c] = PHASES[i]; screen.className = "screen mode-"+m; cap.innerHTML = c; i = (i+1) % PHASES.length; }
show();
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) setInterval(show, 2600);
else { screen.className = "screen mode-detailed scroll-1"; cap.innerHTML = "Every fact labeled, every source named"; }
</script>
</body>
</html>
