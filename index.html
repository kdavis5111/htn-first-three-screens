<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeresThe.News</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <a class="brand" href="index.html">HeresThe.<em>News</em></a>
  </header>

  <main class="hero">
    <div class="demo" aria-hidden="true">
      <div class="chips"><span class="chip pick">World</span><span class="chip">Politics</span><span class="chip pick">Tech</span><span class="chip">Sports</span></div>
      <div class="row"><span class="bar"></span><span class="ok">✓ 4 sources</span></div>
      <div class="row drop"><span class="bar s"></span></div>
      <div class="row"><span class="bar s"></span><span class="ok">✓ 3 sources</span></div>
      <div class="row drop"><span class="bar"></span></div>
      <div class="row drop"><span class="bar s"></span></div>
      <div class="row"><span class="bar"></span><span class="ok">✓ 3 sources</span></div>
      <div class="row drop"><span class="bar"></span></div>
      <div class="row"><span class="bar s"></span><span class="ok">✓ 5 sources</span></div>
      <div class="row drop"><span class="bar"></span></div>
      <span class="done">Done ✓</span>
    </div>

    <h1>Your news, sized to your morning. <em>Then you're done.</em></h1>

    <div class="actions">
      <a class="btn btn-primary" href="topics.html">Build my brief</a>
      <a class="btn btn-link" href="brief.html">I've been here before</a>
    </div>
  </main>
</div>
</body>
</html>
