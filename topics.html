<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeresThe.News — Topics</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <a class="back" href="index.html" aria-label="Back to start">&#8592;</a>
    <a class="brand" href="index.html">HeresThe.<em>News</em></a>
  </header>
  <div class="progress" aria-label="Step 1 of 2"><span style="width:50%"></span></div>

  <h1>I want to read about…</h1>

  <form id="topicsForm">
    <ul class="topics" id="topicList"></ul>
    <div class="sticky">
      <button class="btn btn-primary" id="continueBtn" type="submit" disabled>Continue</button>
      <p class="muted" style="margin:8px 0 0">Saved on this device. Change anytime.</p>
    </div>
  </form>
</div>

<script>
const TOPICS = [
  ["world","World","🌍"],["national","National","🏛️"],["politics","Politics","🗳️"],
  ["business","Business","📈"],["technology","Technology","💻"],["science","Science","🔬"],
  ["health","Health","🩺"],["sports","Sports","🏈"],["weather","Weather","🌦️"],
  ["boxoffice","Box Office","🎬"],["pop","Pop Culture","🎤"]
];
const saved = new Set(JSON.parse(localStorage.getItem("htn.topics")||"[]"));
const list = document.getElementById("topicList");
list.innerHTML = TOPICS.map(([id,name,ico]) => `
  <li><label>
    <input type="checkbox" name="topic" value="${id}" ${saved.has(id)?"checked":""}>
    <span class="ico">${ico}</span>
    <span class="name">${name}</span>
    <span class="tick">✓</span>
  </label></li>`).join("");

const btn = document.getElementById("continueBtn");
function refresh(){
  const n = list.querySelectorAll("input:checked").length;
  btn.disabled = n === 0;
  btn.textContent = n === 0 ? "Pick at least one" : "Continue";
}
list.addEventListener("change", refresh);
refresh();

document.getElementById("topicsForm").addEventListener("submit", e => {
  e.preventDefault();
  localStorage.setItem("htn.topics", JSON.stringify([...list.querySelectorAll("input:checked")].map(i => i.value)));
  location.href = "brief.html";
});
</script>
</body>
</html>
