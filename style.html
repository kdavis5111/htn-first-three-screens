<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeresThe.News — Your style</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <a class="back" href="index.html" aria-label="Back to start">&#8592;</a>
    <a class="brand" href="index.html">HeresThe.<em>News</em></a>
  </header>
  <div class="progress" aria-label="Step 2 of 2"><span style="width:100%"></span></div>

  <h1>Pick your style</h1>

  <div class="choices" id="seg">
    <label class="choice"><input type="radio" name="mode" value="headlines"><span class="t">Headlines<span class="d">Just the headline</span></span><span class="tick">✓</span></label>
    <label class="choice"><input type="radio" name="mode" value="compact"><span class="t">Compact<span class="d">Headline and why it matters</span></span><span class="tick">✓</span></label>
    <label class="choice"><input type="radio" name="mode" value="detailed"><span class="t">Detailed<span class="d">Every fact, labeled and sourced</span></span><span class="tick">✓</span></label>
  </div>

  <div class="bubble-wrap">
    <span class="mark" aria-hidden="true">HT<em>.</em></span>
    <p class="bubble">You can always change your style later.</p>
  </div>

  <div class="picker">
    <a class="btn btn-primary" href="https://heresthe.news" id="finish" aria-disabled="true">Pick a style</a>
  </div>
</div>
<script>
const seg = document.getElementById("seg"), finish = document.getElementById("finish");
const saved = localStorage.getItem("htn.style");
if (saved) { const r = seg.querySelector(`input[value="${saved}"]`); if (r) r.checked = true; }
function apply(){
  const picked = seg.querySelector("input:checked");
  seg.querySelectorAll(".choice").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
  finish.textContent = picked ? "Show my paper" : "Pick a style";
  finish.setAttribute("aria-disabled", picked ? "false" : "true");
  if (picked) localStorage.setItem("htn.style", picked.value);
}
seg.addEventListener("change", apply);
finish.addEventListener("click", e => { if (finish.getAttribute("aria-disabled") === "true") e.preventDefault(); });
apply();
</script>
</body>
</html>
