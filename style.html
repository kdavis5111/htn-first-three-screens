<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HeresThe.News — Your style</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="masthead">
    <a class="back" href="index.html" aria-label="Back to start">&#8592;</a>
    <a class="brand" href="index.html">HeresThe.<em>News</em></a>
  </header>
  <div class="progress" aria-label="Step 2 of 2"><span style="width:100%"></span></div>

  <h1>Pick your style</h1>

  <div class="choices" id="seg">
    <label class="choice"><input type="radio" name="mode" value="headlines"><span class="t">Headlines</span><span class="d">Just the news</span><span class="tick">✓</span></label>
    <label class="choice on"><input type="radio" name="mode" value="compact" checked><span class="t">Compact</span><span class="d">+ why it matters</span><span class="tick">✓</span></label>
    <label class="choice"><input type="radio" name="mode" value="detailed"><span class="t">Detailed</span><span class="d">+ facts &amp; sources</span><span class="tick">✓</span></label>
  </div>
  <p class="note"><span class="dot"></span>You can always change your style later.</p>

  <p class="eyebrow">Preview</p>
  <div id="example" class="mode-compact"></div>

  <div class="picker">
    <a class="btn btn-primary" href="https://heresthe.news" id="finish">Show my paper</a>
  </div>
</div>
<script src="story.js"></script>
<script>
const ex = document.getElementById("example"), seg = document.getElementById("seg");
ex.innerHTML = STORY_HTML;
const saved = localStorage.getItem("htn.style");
if (saved) { const r = seg.querySelector(`input[value="${saved}"]`); if (r) r.checked = true; }
function apply(){
  const m = seg.querySelector("input:checked").value;
  ex.className = "mode-"+m;
  seg.querySelectorAll(".choice").forEach(l => l.classList.toggle("on", l.querySelector("input").checked));
  localStorage.setItem("htn.style", m);
}
seg.addEventListener("change", apply);
apply();
</script>
</body>
</html>
